<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Recommendations - Perpuz Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/feather-icons"></script>
</head>

<body>

    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar d-flex flex-column p-3 glass">
            <div class="d-flex align-items-center mb-4 px-2">
                <div class="bg-danger rounded-circle p-2 me-2">
                    <i data-feather="book" class="text-white"></i>
                </div>
                <h5 class="m-0 fw-bold">Perpuz Admin</h5>
            </div>

            <nav class="nav flex-column gap-2">
                <a class="nav-link rounded" href="dashboard.html">
                    <i data-feather="grid"></i> Overview
                </a>
                <a class="nav-link rounded" href="books.html">
                    <i data-feather="book-open"></i> Manage Books
                </a>
                <a class="nav-link rounded" href="members.html">
                    <i data-feather="users"></i> Members
                </a>
                <a class="nav-link rounded" href="transactions.html">
                    <i data-feather="repeat"></i> Transactions
                </a>
                <a class="nav-link active rounded" href="recommendations.html">
                    <i data-feather="star"></i> Recommendations
                </a>
                <a class="nav-link rounded text-danger mt-auto" href="#" id="logoutBtn">
                    <i data-feather="log-out"></i> Logout
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content w-100">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">Daily Book Recommendations</h2>
                    <p class="text-secondary m-0">Manage the 5 books displayed to all members daily</p>
                </div>
            </div>

            <!-- Current Count -->
            <div class="alert alert-info d-flex align-items-center mb-4">
                <i data-feather="info" class="me-2"></i>
                <span>Current recommendations: <strong id="currentCount">0</strong> / 5</span>
            </div>

            <!-- Recommended Books -->
            <div class="card glass p-4 rounded-4 mb-4">
                <h5 class="fw-bold mb-3">Current Recommendations</h5>
                <div id="recommendationsList" class="row g-3">
                    <div class="col-12 text-center text-secondary py-4">
                        Loading recommendations...
                    </div>
                </div>
            </div>

            <!-- Add Book Section -->
            <div class="card glass p-4 rounded-4">
                <h5 class="fw-bold mb-3">Add Book to Recommendations</h5>
                <div class="row g-3">
                    <div class="col-md-8">
                        <select class="form-select" id="bookSelect">
                            <option value="">Loading available books...</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-primary w-100" id="addRecommendationBtn">
                            <i data-feather="plus" style="width: 16px; height: 16px;"></i> Add to Recommendations
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script>
        feather.replace();

        // Logout Logic
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('perpuz_token');
            window.location.href = 'index.html';
        });

        let availableBooks = [];

        // Load current recommendations
        async function loadRecommendations() {
            try {
                const recs = await api.get('/recommendations');
                const container = document.getElementById('recommendationsList');
                const countEl = document.getElementById('currentCount');

                countEl.textContent = recs.length;
                container.innerHTML = '';

                if (recs.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center text-secondary py-4">No recommendations yet. Add up to 5 books below.</div>';
                    return;
                }

                recs.forEach((rec, index) => {
                    const card = `
                        <div class="col-md-6 col-lg-4">
                            <div class="card bg-dark border-secondary">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <span class="badge bg-primary">#${rec.display_order}</span>
                                        <button class="btn btn-sm btn-outline-danger" onclick="removeRecommendation(${rec.id})">
                                            <i data-feather="x" style="width: 14px; height: 14px;"></i>
                                        </button>
                                    </div>
                                    <h6 class="card-title fw-bold">${rec.title}</h6>
                                    <p class="card-text small text-secondary mb-1">by ${rec.author}</p>
                                    <p class="card-text small"><code>${rec.isbn}</code></p>
                                </div>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', card);
                });

                feather.replace();
            } catch (err) {
                console.error(err);
            }
        }

        // Load available books for dropdown
        async function loadBooks() {
            try {
                availableBooks = await api.get('/books');
                const select = document.getElementById('bookSelect');
                select.innerHTML = '<option value="">Select a book...</option>';

                availableBooks.forEach(book => {
                    const option = `<option value="${book.id}">${book.title} - ${book.author}</option>`;
                    select.insertAdjacentHTML('beforeend', option);
                });
            } catch (err) {
                console.error(err);
            }
        }

        // Add recommendation
        document.getElementById('addRecommendationBtn').addEventListener('click', async () => {
            const bookId = document.getElementById('bookSelect').value;

            if (!bookId) {
                alert('Please select a book');
                return;
            }

            try {
                await api.post('/recommendations', { book_id: bookId });
                document.getElementById('bookSelect').value = '';
                loadRecommendations();
            } catch (err) {
                alert(err.message || 'Failed to add recommendation');
            }
        });

        // Remove recommendation
        window.removeRecommendation = async function (id) {
            if (!confirm('Remove this book from recommendations?')) return;

            try {
                await api.delete('/recommendations/' + id);
                loadRecommendations();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        };

        // Initial load
        loadRecommendations();
        loadBooks();
    </script>
</body>

</html>
