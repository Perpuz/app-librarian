<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Perpuz Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="login-container">
        <div class="card login-card glass shadow-lg">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-white">Perpuz Admin</h3>
                <p class="text-muted">Sign in to manage library</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label text-secondary">Username</label>
                    <input type="text" class="form-control" id="username" required placeholder="Enter username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label text-secondary">Password</label>
                    <input type="password" class="form-control" id="password" required placeholder="Enter password">
                </div>

                <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            // Reset error
            errorMsg.classList.add('d-none');
            errorMsg.innerText = '';

            try {
                // Since our API expects URL encoded or JSON. api.post sends JSON.
                // Our Auth controller: $this->request->getVar() works for both json and form-data if properly set.
                // CI4 Request::getVar() checks JSON body too.

                const result = await api.post('/auth/login', { username, password });

                if (result.status === 200) {
                    localStorage.setItem('perpuz_token', result.token);
                    localStorage.setItem('user', JSON.stringify(result.user));
                    window.location.href = 'dashboard.html';
                } else {
                    throw new Error(result.message || 'Login failed');
                }
            } catch (error) {
                errorMsg.classList.remove('d-none');
                errorMsg.innerText = error.message;
            }
        });
    </script>
</body>

</html>
