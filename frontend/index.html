<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Perpuz Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="login-container">
        <div class="card login-card shadow-lg border-0">
            <div class="text-center mb-4">
                <div class="bg-primary-brand rounded-circle d-inline-flex p-3 mb-3">
                    <i data-feather="book" class="text-white" style="width: 24px; height: 24px;"></i>
                </div>
                <h3 class="fw-bold text-dark">Perpuz Admin</h3>
                <p class="text-muted">Sign in to manage library</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label text-secondary fw-semibold">Username</label>
                    <input type="text" class="form-control py-2" id="username" required placeholder="Enter username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label text-secondary fw-semibold">Password</label>
                    <input type="password" class="form-control py-2" id="password" required placeholder="Enter password">
                </div>
                
                <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold bg-primary-brand border-0">Sign In</button>
            </form>
        </div>
    </div>
    <script src="https://unpkg.com/feather-icons"></script>
    <script>feather.replace();</script>

    <!-- Scripts -->
    <script src="assets/js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            // Reset error
            errorMsg.classList.add('d-none');
            errorMsg.innerText = '';

            try {
                // Since our API expects URL encoded or JSON. api.post sends JSON.
                // Our Auth controller: $this->request->getVar() works for both json and form-data if properly set.
                // CI4 Request::getVar() checks JSON body too.
                
                const result = await api.post('/auth/login', { username, password });
                
                if (result.status === 200) {
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('user', JSON.stringify(result.user));
                    window.location.href = 'dashboard.html';
                } else {
                     throw new Error(result.message || 'Login failed');
                }
            } catch (error) {
                errorMsg.classList.remove('d-none');
                errorMsg.innerText = error.message;
            }
        });
    </script>
</body>
</html>
