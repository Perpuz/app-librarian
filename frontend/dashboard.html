<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Perpuz Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=2">
    <script src="https://unpkg.com/feather-icons"></script>
</head>

<body>

    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar d-flex flex-column p-3">
            <div class="d-flex align-items-center mb-4 px-2">
                <div class="bg-primary-brand rounded-circle p-2 me-2">
                    <i data-feather="book" class="text-white"></i>
                </div>
                <h5 class="m-0 fw-bold">Perpuz Admin</h5>
            </div>

            <nav class="nav flex-column gap-2">
                <a class="nav-link active rounded" href="dashboard.html">
                    <i data-feather="grid"></i> Overview
                </a>
                <a class="nav-link rounded" href="books.html">
                    <i data-feather="book-open"></i> Manage Books
                </a>
                <a class="nav-link rounded" href="members.html">
                    <i data-feather="users"></i> Members
                </a>
                <a class="nav-link rounded" href="transactions.html">
                    <i data-feather="repeat"></i> Transactions
                </a>
                <a class="nav-link rounded text-danger mt-auto" href="#" id="logoutBtn">
                    <i data-feather="log-out"></i> Logout
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content w-100">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 class="fw-bold mb-1">Admin Overview</h2>
                    <p class="text-secondary m-0">Monitor and manage library operations.</p>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="row g-4 mb-5">
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-title mb-2">Total Books</div>
                        <div class="stat-value" id="totalBooks">-</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-title mb-2">Active Members</div>
                        <div class="stat-value" id="activeMembers">-</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-title mb-2">Total Transactions</div>
                        <div class="stat-value" id="totalTransactions">-</div>
                    </div>
                </div>
            </div>

            <!-- Recent Transactions -->
            <div class="card p-4 border-0 shadow-sm" style="background: white;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold m-0">Recent Transactions</h5>
                    <a href="transactions.html" class="text-primary text-decoration-none text-sm fw-semibold">View
                        All</a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Book Title</th>
                                <th>Member</th>
                                <th>Due Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsTableBody">
                            <tr>
                                <td colspan="5" class="text-center text-secondary py-4">Loading data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        feather.replace();

        // Logout Logic
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        });

        // Dashboard Logic
        async function loadDashboard() {
            try {
                const data = await api.get('/dashboard');

                // Update Stats
                document.getElementById('totalBooks').innerText = data.total_books;
                document.getElementById('activeMembers').innerText = data.active_members;
                document.getElementById('totalTransactions').innerText = data.total_transactions;

                // Update Table
                const tbody = document.getElementById('transactionsTableBody');
                tbody.innerHTML = '';

                if (data.recent_transactions.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-secondary py-4">No recent transactions</td></tr>';
                    return;
                }

                data.recent_transactions.forEach(trx => {
                    let statusBadge = '';
                    switch (trx.status) {
                        case 'borrowed': statusBadge = '<span class="badge bg-warning text-dark">Borrowed</span>'; break;
                        case 'returned': statusBadge = '<span class="badge bg-success">Returned</span>'; break;
                        case 'overdue': statusBadge = '<span class="badge bg-danger">Overdue</span>'; break;
                    }

                    const row = `
                        <tr>
                            <td class="fw-semibold">${trx.book_title}</td>
                            <td>${trx.member_name}</td>
                            <td>${trx.due_date}</td>
                            <td>${statusBadge}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-secondary rounded-circle" style="width: 32px; height: 32px; padding: 0;">
                                    <i data-feather="more-horizontal" style="width: 16px;"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', row);
                });
                feather.replace();

            } catch (error) {
                console.error(error);
                // Redirect if auth failed handled in api.js, but visual feedback:
                // document.getElementById('transactionsTableBody').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Failed to load data</td></tr>';
            }
        }

        loadDashboard();
    </script>
</body>

</html>
